<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0F0F11" />
    <meta name="description" content="No Wave Company — No Wave. Just Tilt. Dining, Redefined. View-only digital QR restaurant menu with live kitchen availability synchronization." />
    
    <title>No Wave Company — No Wave. Just Tilt. Dining, Redefined.</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-obsidian text-zinc-100 antialiased min-h-screen selection:bg-amber-500/20 selection:text-amber-400">
    <div id="root">
      <!-- Initial Loading / Static Fallback Container -->
      <div id="app-loader" class="min-h-screen flex flex-col items-center justify-center p-6 text-center" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0F0F11; color: #f4f4f5;">
        <div style="max-width: 480px; width: 100%; background: #18181b; border: 1px solid #27272a; border-radius: 20px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
          <div style="display: inline-block; padding: 6px 14px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 9999px; color: #f59e0b; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px;">
            No Wave Company
          </div>
          <h2 style="font-size: 24px; font-weight: 800; color: #ffffff; margin: 0 0 8px 0; letter-spacing: 0.05em;">
            Dining, Redefined.
          </h2>
          <p id="loader-status" style="font-size: 13px; color: #a1a1aa; margin: 0 0 20px 0; line-height: 1.5;">
            Loading digital menu...
          </p>
          <div id="spinner" style="width: 32px; height: 32px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
          
          <div id="file-warning" style="display: none; text-align: left; background: #0F0F11; border: 1px solid #3f3f46; border-radius: 12px; padding: 16px; margin-top: 16px;">
            <p style="font-size: 13px; font-weight: 600; color: #f59e0b; margin: 0 0 6px 0;">
              ⚠️ Opened as Local File (file://)
            </p>
            <p style="font-size: 12px; color: #d4d4d8; margin: 0 0 12px 0; line-height: 1.5;">
              Modern browsers block JavaScript modules on <code>file://</code> URLs for security reasons. Open the app via the local server instead:
            </p>
            <a href="http://localhost:3000/" style="display: block; text-align: center; background: #f59e0b; color: #000; font-weight: 700; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; margin-bottom: 8px;">
              Open http://localhost:3000/
            </a>
            <div style="font-size: 11px; color: #71717a; text-align: center;">
              Or run in terminal: <code style="color: #e4e4e7;">npm run dev</code>
            </div>
          </div>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>

    <!-- Vite HMR Entry (Active when running through Vite development server) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Automatic Fallback & Diagnostic Loader when opened outside Vite -->
    <script>
      (function() {
        var isFileProto = window.location.protocol === 'file:';
        if (isFileProto) {
          setTimeout(function() {
            var warn = document.getElementById('file-warning');
            var spin = document.getElementById('spinner');
            var status = document.getElementById('loader-status');
            if (warn && spin) {
              spin.style.display = 'none';
              warn.style.display = 'block';
              if (status) status.innerText = 'Application requires local server';
            }
          }, 800);
        } else {
          // If opened via non-Vite static server (e.g. VS Code Live Server), /src/main.tsx won't compile
          // Fall back to pre-built assets if React has not mounted within 1.2s
          setTimeout(function() {
            var loader = document.getElementById('app-loader');
            if (loader) {
              if (!document.getElementById('bundle-css')) {
                var link = document.createElement('link');
                link.id = 'bundle-css';
                link.rel = 'stylesheet';
                link.href = './assets/index.css';
                document.head.appendChild(link);
              }
              if (!document.getElementById('bundle-js')) {
                var s = document.createElement('script');
                s.id = 'bundle-js';
                s.type = 'module';
                s.src = './assets/index.js';
                document.body.appendChild(s);
              }
            }
          }, 1200);
        }
      })();
    </script>
  </body>
</html>
